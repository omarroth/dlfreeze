name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build and test
        run: make WERROR=1 test

  package:
    name: Package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, platform: amd64, runner: ubuntu-24.04, cpu: x86-64, ldflags: '' }
          - { arch: aarch64, platform: arm64, runner: ubuntu-24.04-arm, cpu: armv8-a, ldflags: '-Wl,-z,max-page-size=65536' }
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify release archive on the glibc baseline
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          CPU: ${{ matrix.cpu }}
          RELEASE_LDFLAGS: ${{ matrix.ldflags }}
        run: |
          mkdir -p dist
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          # Build on an explicit pre-amd64v3 distribution baseline. Newer
          # runner images can otherwise raise the libc and ISA requirements.
          docker run --rm --platform "linux/$PLATFORM" \
            -v "$PWD":/source:ro -v "$PWD/dist":/dist -w /work \
            -e ARCH -e CPU -e RELEASE_LDFLAGS -e SOURCE_DATE_EPOCH \
            ubuntu:22.04 bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends build-essential musl-tools
              cp -a /source/Makefile /source/README.md /source/LICENSE /source/include /source/src /work/
              make -j"$(nproc)" WERROR=1 CC=gcc STATIC_CC=musl-gcc DIST=/dist \
                MUSL_LICENSE=/usr/share/doc/musl/copyright \
                CFLAGS="-Wall -Wextra -O2 -g -D_GNU_SOURCE -Iinclude -march=$CPU" \
                LDFLAGS="$RELEASE_LDFLAGS" package
              bash /source/tests/release-package-gate.sh "/dist/dlfreeze-linux-$ARCH.tar.gz" "$ARCH" glibc
              if [ "$ARCH" = aarch64 ]; then
                bash /source/tests/release-package-gate.sh "/dist/dlfreeze-linux-$ARCH.tar.gz" "$ARCH" glibc-direct
              fi
            '

      - name: Verify the same archive on musl
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --platform "linux/$PLATFORM" \
            -v "$PWD":/source:ro -v "$PWD/dist":/dist:ro -e ARCH \
            alpine:3.22 sh -euc '
              apk add --no-cache bash build-base binutils
              bash /source/tests/release-package-gate.sh "/dist/dlfreeze-linux-$ARCH.tar.gz" "$ARCH" musl
            '

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/dlfreeze-linux-${{ matrix.arch }}.tar.gz
            dist/dlfreeze-linux-${{ matrix.arch }}.tar.gz.sha256

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, package]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify assets and extract release notes
        run: |
          (cd dist && sha256sum -c dlfreeze-linux-{x86_64,aarch64}.tar.gz.sha256)
          git show-ref --verify --quiet "$GITHUB_REF"
          notes=$(git for-each-ref --format='%(contents)' "$GITHUB_REF")
          signature=$(git for-each-ref --format='%(contents:signature)' "$GITHUB_REF")
          # Git includes the signature in contents for signed tags. Publish
          # only the annotation, without reflowing the Markdown subject/body.
          if [ -n "$signature" ]; then
            printf '%s' "${notes%"$signature"}"
          else
            printf '%s\n' "$notes"
          fi > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/dlfreeze-linux-x86_64.tar.gz
            dist/dlfreeze-linux-x86_64.tar.gz.sha256
            dist/dlfreeze-linux-aarch64.tar.gz
            dist/dlfreeze-linux-aarch64.tar.gz.sha256
