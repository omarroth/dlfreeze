name: Cross-Platform Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture to exercise
        required: true
        default: all
        type: choice
        options: [all, amd64, arm64]
      environment:
        description: Build and target environment to exercise
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu-18.04
          - ubuntu-20.04
          - ubuntu-22.04
          - ubuntu-24.04
          - alpine-3.14
          - alpine-3.20
          - alpine-edge
          - debian-12
          - debian-trixie
          - fedora-41
          - fedora-rawhide
          - arch-latest
      test_start_at:
        description: Optional first tests/run_tests.sh function
        required: false
        type: string
      test_stop_after:
        description: Optional last tests/run_tests.sh function
        required: false
        type: string

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build dlfreeze, run test suite, freeze cross-test programs ────
  build-and-test:
    name: build (${{ matrix.env }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64
          - { env: ubuntu-18.04,  image: "ubuntu:18.04",      arch: amd64 }
          - { env: ubuntu-20.04,  image: "ubuntu:20.04",      arch: amd64 }
          - { env: ubuntu-22.04,  image: "ubuntu:22.04",      arch: amd64 }
          - { env: ubuntu-24.04,  image: "ubuntu:24.04",      arch: amd64 }
          - { env: alpine-3.14,   image: "alpine:3.14",       arch: amd64 }
          - { env: alpine-3.20,   image: "alpine:3.20",       arch: amd64 }
          - { env: alpine-edge,   image: "alpine:edge",       arch: amd64 }
          - { env: debian-12,     image: "debian:12",         arch: amd64 }
          - { env: debian-trixie, image: "debian:trixie",     arch: amd64 }
          - { env: fedora-41,     image: "fedora:41",         arch: amd64 }
          - { env: fedora-rawhide,image: "fedora:rawhide",    arch: amd64 }
          - { env: arch-latest,   image: "archlinux:latest",  arch: amd64 }
          # aarch64 (native GitHub-hosted arm64 runner)
          - { env: ubuntu-18.04,  image: "ubuntu:18.04",      arch: arm64 }
          - { env: ubuntu-20.04,  image: "ubuntu:20.04",      arch: arm64 }
          - { env: ubuntu-22.04,  image: "ubuntu:22.04",      arch: arm64 }
          - { env: ubuntu-24.04,  image: "ubuntu:24.04",      arch: arm64 }
          - { env: alpine-3.14,   image: "alpine:3.14",       arch: arm64 }
          - { env: alpine-3.20,   image: "alpine:3.20",       arch: arm64 }
          - { env: alpine-edge,   image: "alpine:edge",       arch: arm64 }
          - { env: debian-12,     image: "debian:12",         arch: arm64 }
          - { env: debian-trixie, image: "debian:trixie",     arch: arm64 }
          - { env: fedora-41,     image: "fedora:41",         arch: arm64 }
          - { env: fedora-rawhide,image: "fedora:rawhide",    arch: arm64 }
          # Arch's official image only ships amd64; arm64 requires
          # the community-maintained menci/archlinuxarm fork.
          - { env: arch-latest,   image: "menci/archlinuxarm:base", arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Build, test, and freeze
        if: >-
          github.event_name != 'workflow_dispatch' ||
          ((inputs.architecture == 'all' || inputs.architecture == matrix.arch) &&
           (inputs.environment == 'all' || inputs.environment == matrix.env))
        env:
          TEST_START_AT: ${{ inputs.test_start_at || '' }}
          TEST_STOP_AFTER: ${{ inputs.test_stop_after || '' }}
        run: |
          set -o pipefail
          mkdir -p build
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD":/source:ro -v "$PWD/build":/out -w /work \
            -e DLFREEZE_HOST_UID="$(id -u)" \
            -e DLFREEZE_HOST_GID="$(id -g)" \
            -e TEST_START_AT \
            -e TEST_STOP_AFTER \
            ${{ matrix.image }} \
            sh -lc '
              cp -a /source/Makefile /source/LICENSE /source/README.md \
                /source/include /source/src /source/tests /work/
              status=0
              OUTDIR=/out/cross-test sh /work/tests/cross-build.sh || status=$?
              chown -R "$DLFREEZE_HOST_UID:$DLFREEZE_HOST_GID" \
                /out/cross-test 2>/dev/null || true
              exit "$status"
            ' 2>&1 | tee cross-build.log

      - name: Upload frozen artifacts
        if: >-
          success() &&
          (github.event_name != 'workflow_dispatch' ||
           ((inputs.architecture == 'all' || inputs.architecture == matrix.arch) &&
            (inputs.environment == 'all' || inputs.environment == matrix.env)))
        uses: actions/upload-artifact@v4
        with:
          name: frozen-${{ matrix.env }}-${{ matrix.arch }}
          path: build/cross-test/

      - name: Upload build diagnostics
        if: >-
          always() &&
          (github.event_name != 'workflow_dispatch' ||
           ((inputs.architecture == 'all' || inputs.architecture == matrix.arch) &&
            (inputs.environment == 'all' || inputs.environment == matrix.env)))
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-build-${{ matrix.env }}-${{ matrix.arch }}
          path: cross-build.log
          if-no-files-found: ignore

  # ── Run frozen binaries from every build env on every target env ──
  cross-run:
    name: run (${{ matrix.env }}, ${{ matrix.arch }})
    needs: build-and-test
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64
          - { env: ubuntu-18.04,  image: "ubuntu:18.04",      arch: amd64 }
          - { env: ubuntu-20.04,  image: "ubuntu:20.04",      arch: amd64 }
          - { env: ubuntu-22.04,  image: "ubuntu:22.04",      arch: amd64 }
          - { env: ubuntu-24.04,  image: "ubuntu:24.04",      arch: amd64 }
          - { env: alpine-3.14,   image: "alpine:3.14",       arch: amd64 }
          - { env: alpine-3.20,   image: "alpine:3.20",       arch: amd64 }
          - { env: alpine-edge,   image: "alpine:edge",       arch: amd64 }
          - { env: debian-12,     image: "debian:12",         arch: amd64 }
          - { env: debian-trixie, image: "debian:trixie",     arch: amd64 }
          - { env: fedora-41,     image: "fedora:41",         arch: amd64 }
          - { env: fedora-rawhide,image: "fedora:rawhide",    arch: amd64 }
          - { env: arch-latest,   image: "archlinux:latest",  arch: amd64 }
          # aarch64
          - { env: ubuntu-18.04,  image: "ubuntu:18.04",      arch: arm64 }
          - { env: ubuntu-20.04,  image: "ubuntu:20.04",      arch: arm64 }
          - { env: ubuntu-22.04,  image: "ubuntu:22.04",      arch: arm64 }
          - { env: ubuntu-24.04,  image: "ubuntu:24.04",      arch: arm64 }
          - { env: alpine-3.14,   image: "alpine:3.14",       arch: arm64 }
          - { env: alpine-3.20,   image: "alpine:3.20",       arch: arm64 }
          - { env: alpine-edge,   image: "alpine:edge",       arch: arm64 }
          - { env: debian-12,     image: "debian:12",         arch: arm64 }
          - { env: debian-trixie, image: "debian:trixie",     arch: arm64 }
          - { env: fedora-41,     image: "fedora:41",         arch: arm64 }
          - { env: fedora-rawhide,image: "fedora:rawhide",    arch: arm64 }
          - { env: arch-latest,   image: "menci/archlinuxarm:base", arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen artifacts
        if: >-
          github.event_name != 'workflow_dispatch' ||
          ((inputs.architecture == 'all' || inputs.architecture == matrix.arch) &&
           (inputs.environment == 'all' || inputs.environment == matrix.env))
        uses: actions/download-artifact@v4
        with:
          pattern: frozen-*-${{ matrix.arch }}
          path: frozen-all/

      - name: Cross-run frozen binaries
        if: >-
          github.event_name != 'workflow_dispatch' ||
          ((inputs.architecture == 'all' || inputs.architecture == matrix.arch) &&
           (inputs.environment == 'all' || inputs.environment == matrix.env))
        run: |
          set -o pipefail
          sh tests/cross-run.sh --selftest-direct-contract-policy
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD":/work -w /work \
            -e DLFREEZE_REQUIRE_DIRECT_CONTRACTS=${{ (github.event_name != 'workflow_dispatch' || inputs.environment == 'all') && '1' || '0' }} \
            -e DLFREEZE_REQUIRE_ALL_DIRECT_CONTRACTS=${{ (github.event_name != 'workflow_dispatch' || inputs.environment == 'all') && '1' || '0' }} \
            ${{ matrix.image }} \
            sh /work/tests/cross-run.sh 2>&1 | tee cross-run.log

      - name: Upload run diagnostics
        if: >-
          always() &&
          (github.event_name != 'workflow_dispatch' ||
           ((inputs.architecture == 'all' || inputs.architecture == matrix.arch) &&
            (inputs.environment == 'all' || inputs.environment == matrix.env)))
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-run-${{ matrix.env }}-${{ matrix.arch }}
          path: cross-run.log
          if-no-files-found: ignore
