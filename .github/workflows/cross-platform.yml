name: Cross-Platform Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build dlfreeze, run test suite, freeze cross-test programs ────
  build-and-test:
    name: build (${{ matrix.env }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64
          - { env: ubuntu-18.04,  image: "ubuntu:18.04",      arch: amd64 }
          - { env: ubuntu-20.04,  image: "ubuntu:20.04",      arch: amd64 }
          - { env: ubuntu-24.04,  image: "ubuntu:24.04",      arch: amd64 }
          - { env: alpine-3.20,   image: "alpine:3.20",       arch: amd64 }
          - { env: debian-12,     image: "debian:12",         arch: amd64 }
          - { env: debian-trixie, image: "debian:trixie",     arch: amd64 }
          - { env: fedora-41,     image: "fedora:41",         arch: amd64 }
          - { env: fedora-rawhide,image: "fedora:rawhide",    arch: amd64 }
          - { env: arch-latest,   image: "archlinux:latest",  arch: amd64 }
          # aarch64 (native GitHub-hosted arm64 runner)
          - { env: ubuntu-18.04,  image: "ubuntu:18.04",      arch: arm64 }
          - { env: ubuntu-20.04,  image: "ubuntu:20.04",      arch: arm64 }
          - { env: ubuntu-24.04,  image: "ubuntu:24.04",      arch: arm64 }
          - { env: alpine-3.20,   image: "alpine:3.20",       arch: arm64 }
          - { env: debian-12,     image: "debian:12",         arch: arm64 }
          - { env: debian-trixie, image: "debian:trixie",     arch: arm64 }
          - { env: fedora-41,     image: "fedora:41",         arch: arm64 }
          - { env: fedora-rawhide,image: "fedora:rawhide",    arch: arm64 }
          # Arch's official image only ships amd64; arm64 requires
          # the community-maintained menci/archlinuxarm fork.
          - { env: arch-latest,   image: "menci/archlinuxarm:base", arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Build, test, and freeze
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD":/work -w /work \
            ${{ matrix.image }} \
            sh /work/tests/cross-build.sh

      - name: Upload frozen artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frozen-${{ matrix.env }}-${{ matrix.arch }}
          path: build/cross-test/

  # ── Run frozen binaries from every build env on every target env ──
  cross-run:
    name: run (${{ matrix.env }}, ${{ matrix.arch }})
    needs: build-and-test
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64
          - { env: ubuntu-18.04,  image: "ubuntu:18.04",      arch: amd64 }
          - { env: ubuntu-20.04,  image: "ubuntu:20.04",      arch: amd64 }
          - { env: ubuntu-24.04,  image: "ubuntu:24.04",      arch: amd64 }
          - { env: alpine-3.20,   image: "alpine:3.20",       arch: amd64 }
          - { env: debian-12,     image: "debian:12",         arch: amd64 }
          - { env: debian-trixie, image: "debian:trixie",     arch: amd64 }
          - { env: fedora-41,     image: "fedora:41",         arch: amd64 }
          - { env: fedora-rawhide,image: "fedora:rawhide",    arch: amd64 }
          - { env: arch-latest,   image: "archlinux:latest",  arch: amd64 }
          # aarch64
          - { env: ubuntu-18.04,  image: "ubuntu:18.04",      arch: arm64 }
          - { env: ubuntu-20.04,  image: "ubuntu:20.04",      arch: arm64 }
          - { env: ubuntu-24.04,  image: "ubuntu:24.04",      arch: arm64 }
          - { env: alpine-3.20,   image: "alpine:3.20",       arch: arm64 }
          - { env: debian-12,     image: "debian:12",         arch: arm64 }
          - { env: debian-trixie, image: "debian:trixie",     arch: arm64 }
          - { env: fedora-41,     image: "fedora:41",         arch: arm64 }
          - { env: fedora-rawhide,image: "fedora:rawhide",    arch: arm64 }
          - { env: arch-latest,   image: "menci/archlinuxarm:base", arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: frozen-*-${{ matrix.arch }}
          path: frozen-all/

      - name: Cross-run frozen binaries
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD":/work -w /work \
            ${{ matrix.image }} \
            sh /work/tests/cross-run.sh
